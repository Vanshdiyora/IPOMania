name = "ipo-mania-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
workers_dev = true

[triggers]
crons = ["30 3 * * *"]

[vars]
RUNTIME_ENV = "development"

[env.preview]
name = "ipo-mania-api-preview"
workers_dev = true

[env.preview.vars]
RUNTIME_ENV = "test"

[env.production]
name = "ipo-mania-api"
workers_dev = true

[env.production.vars]
RUNTIME_ENV = "production"
