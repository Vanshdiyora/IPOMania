name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database-security:
    name: Supabase RLS tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase database
        run: supabase db start

      - name: Test database row-level security
        run: supabase test db

      - name: Set up Node.js for integration tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for integration tests
        run: npm ci

      - name: Run loopback-only database concurrency tests
        shell: bash
        run: |
          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$db_url" || { echo "::error::Could not obtain the local Supabase DB_URL."; exit 1; }
          case "$db_url" in
            *127.0.0.1*|*localhost*) ;;
            *) echo "::error::Refusing to run database tests against a non-loopback host."; exit 1 ;;
          esac
          DEMAT_TEST_DATABASE_URL="$db_url" npm run test:integration:accounts
          DEMAT_TEST_DATABASE_URL="$db_url" npm run test:integration:applications

  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build:web

      - name: Build Cloudflare Worker
        run: npm run build:api

      - name: Audit dependencies
        run: npm audit --audit-level=high
  browser-tests:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
        env:
          CI: "true"
