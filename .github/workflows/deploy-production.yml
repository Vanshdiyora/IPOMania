name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy production API
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: production-api
      url: ${{ vars.API_HEALTH_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production API configuration
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          test -n "$API_HEALTH_URL" || { echo "::error::Set API_HEALTH_URL in the production-api environment."; exit 1; }

      - name: Build API
        run: npm run build:api

      - name: Deploy production API Worker
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec -- wrangler deploy --env production --keep-vars

      - name: Verify production API health
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          response="$(curl --fail --silent --show-error "$API_HEALTH_URL")"
          printf '%s' "$response" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const payload = JSON.parse(body);
              if (payload.data?.status !== "ok" || payload.data?.environment !== "production") {
                console.error("Production API health check returned an unexpected payload.");
                process.exit(1);
              }
            });
          '

  deploy-web:
    name: Deploy production frontend
    needs: deploy-api
    if: ${{ always() && needs.deploy-api.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) }}
    environment:
      name: production-web
      url: ${{ vars.WEB_HEALTH_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production frontend configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_APP_ORIGIN: ${{ vars.VITE_WEB_APP_ORIGIN }}
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
        run: |
          missing=""
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_WEB_APP_ORIGIN WEB_HEALTH_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name in the production-web environment."
              missing="${missing:+$missing, }$name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing production frontend variables: $missing"
            exit 1
          fi

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_APP_ORIGIN: ${{ vars.VITE_WEB_APP_ORIGIN }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:web

      - name: Deploy production frontend Worker
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec -- wrangler deploy --config ../../apps/web/wrangler.toml --env production --keep-vars

      - name: Verify production frontend
        env:
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
        run: curl --fail --silent --show-error --location "$WEB_HEALTH_URL" --output /dev/null
