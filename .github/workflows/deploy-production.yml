name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy production frontend and API
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_APP_ORIGIN: ${{ vars.VITE_WEB_APP_ORIGIN }}
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Set VITE_SUPABASE_URL in the production environment."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Set VITE_SUPABASE_ANON_KEY in the production environment."; exit 1; }
          test -n "$VITE_WEB_APP_ORIGIN" || { echo "::error::Set VITE_WEB_APP_ORIGIN in the production environment."; exit 1; }
          test -n "$API_HEALTH_URL" || { echo "::error::Set API_HEALTH_URL in the production environment."; exit 1; }
          test -n "$WEB_HEALTH_URL" || { echo "::error::Set WEB_HEALTH_URL in the production environment."; exit 1; }

      - name: Build API
        run: npm run build:api

      - name: Deploy production API Worker
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec -- wrangler deploy --env production --keep-vars

      - name: Verify production API health
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          response="$(curl --fail --silent --show-error "$API_HEALTH_URL")"
          printf '%s' "$response" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const payload = JSON.parse(body);
              if (payload.data?.status !== "ok" || payload.data?.environment !== "production") {
                console.error("Production API health check returned an unexpected payload.");
                process.exit(1);
              }
            });
          '

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_APP_ORIGIN: ${{ vars.VITE_WEB_APP_ORIGIN }}
        run: npm run build:web

      - name: Deploy production frontend Worker
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec -- wrangler deploy --config ../../apps/web/wrangler.toml --env production --keep-vars

      - name: Verify production frontend
        env:
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
        run: curl --fail --silent --show-error --location "$WEB_HEALTH_URL" --output /dev/null
