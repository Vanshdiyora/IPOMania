project_id = "ipo-mania"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:4175"
additional_redirect_urls = ["http://localhost:4175/**", "http://127.0.0.1:4175/**"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
