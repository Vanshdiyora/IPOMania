name = "ipo-mania-web"
main = "src/worker.ts"
compatibility_date = "2026-10-31"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[services]]
binding = "API"
service = "ipo-mania-api"

[env.preview]
name = "ipo-mania-web-preview"
workers_dev = true

[[env.preview.services]]
binding = "API"
service = "ipo-mania-api-preview"

[env.production]
name = "ipo-mania-web"
workers_dev = true

[[env.production.services]]
binding = "API"
service = "ipo-mania-api"
